server {
    listen 80;
    server_name localhost;

    # Health check endpoint
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # JSON API endpoint
    location /api/data {
        default_type application/json;
        return 200 '{"message":"Hello from nginx","framework":"lego-flow-interop"}';
    }

    # Echo back the request method and URI (useful for testing)
    location /echo {
        default_type text/plain;
        return 200 "$request_method $uri";
    }

    # Standard HTML endpoint
    location / {
        default_type text/html;
        return 200 '<html><body><h1>Lego Flow Interop Test</h1></body></html>';
    }
}
