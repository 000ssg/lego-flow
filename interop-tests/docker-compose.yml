# Lego Flow — Protocol Interoperability Test Environment
#
# Spins up reference implementations for testing protocol compliance:
#   nginx        → HTTP/HTTPS server (port 8080)
#   rabbitmq     → AMQP broker           (port 5672)
#   nats         → NATS broker           (port 4222)
#   mosquitto    → MQTT broker (port 1883)
#   activemq     → STOMP broker          (port 61613)
#   redis        → Redis in-memory store (port 6379)
#   openldap     → LDAP server           (port 389)
#   prosody      → XMPP server           (port 5222)
#   postgresql   → PostgreSQL database   (port 5432)
#
# Usage:
#   docker compose up -d
#   mvn verify -pl interop-tests -am
#   docker compose down
#
# Environment variables are read by the Java integration tests:
#   INTEROP_NGINX_HOST, INTEROP_NGINX_PORT
#   INTEROP_MOSQUITTO_HOST, INTEROP_MOSQUITTO_PORT
#   INTEROP_REDIS_HOST, INTEROP_REDIS_PORT
#   INTEROP_PG_HOST, INTEROP_PG_PORT, INTEROP_PG_USER, INTEROP_PG_PASSWORD, INTEROP_PG_DB

services:
  # ── HTTP/HTTPS reference server ────────────────
  nginx:
    image: nginx:alpine
    container_name: legoflow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s

  # ── AMQP reference broker (RabbitMQ) ──────────
  rabbitmq:
    image: rabbitmq:4-management
    container_name: legoflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ── NATS reference broker ──────────────────────
  nats:
    image: nats:latest
    container_name: legoflow-nats
    ports:
      - "4222:4222"
    command: ["-js", "-DV", "-http_port", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8222/varz > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── XMPP reference server (Prosody) ──────────
  prosody:
    image: prosody/prosody:latest
    container_name: legoflow-prosody
    ports:
      - "5222:5222"
      - "5269:5269"
    volumes:
      - ./docker/prosody.cfg.lua:/prosody/prosody.cfg.lua:ro
      - ./docker/localhost.crt:/prosody/certs/localhost.crt:ro
      - ./docker/localhost.key:/prosody/certs/localhost.key:ro
    command: >
      sh -c "
        mkdir -p /prosody/data &&
        prosody --config /prosody/prosody.cfg.lua &
        PROSODY_PID=$$!
        for i in $$(seq 1 30); do
          nc -z localhost 5570 2>/dev/null && break
          sleep 1
        done
        prosodyctl --config /prosody/prosody.cfg.lua register test localhost test
        wait $$PROSODY_PID
      "
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ── STOMP reference broker (ActiveMQ) ──────────
  activemq:
    image: apache/activemq:latest
    container_name: legoflow-activemq
    ports:
      - "61613:61613"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 61613 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── LDAP reference server (OpenLDAP) ───────────
  openldap:
    image: osixia/openldap:latest
    container_name: legoflow-openldap
    ports:
      - "389:389"
    environment:
      LDAP_ADMIN_PASSWORD: admin
      LDAP_BASE_DN: dc=example,dc=com
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=example,dc=com -D cn=admin,dc=example,dc=com -w admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30


  # ── MQTT reference broker ───────────────────────
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: legoflow-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis reference server ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: legoflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── PostgreSQL reference server ────────────────
  postgresql:
    image: postgres:17-alpine
    container_name: legoflow-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: legoflow
      POSTGRES_PASSWORD: legoflow
      POSTGRES_DB: legoflow_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legoflow || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
