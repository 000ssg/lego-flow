# Lego Flow — Protocol Interoperability Test Environment
#
# Spins up reference implementations for testing protocol compliance:
#   nginx        → HTTP/HTTPS server (port 8080)
#   activemq     → AMQP 1.0 + STOMP broker (ports 5672, 61613)
#   nats         → NATS broker           (port 4222)
#   mosquitto    → MQTT broker (port 1883)
#   redis        → Redis in-memory store (port 6379)
#   openldap     → LDAP server           (port 389)
#   prosody      → XMPP server           (port 5222)
#   postgresql   → PostgreSQL database   (port 5432)
#   mailhog      → SMTP server           (port 25)
#   ftp          → FTP server            (port 21)
#
# Usage:
#   docker compose up -d
#   mvn verify -pl interop-tests -am
#   docker compose down
#
# Environment variables are read by the Java integration tests:
#   INTEROP_NGINX_HOST, INTEROP_NGINX_PORT
#   INTEROP_MOSQUITTO_HOST, INTEROP_MOSQUITTO_PORT
#   INTEROP_REDIS_HOST, INTEROP_REDIS_PORT
#   INTEROP_PG_HOST, INTEROP_PG_PORT, INTEROP_PG_USER, INTEROP_PG_PASSWORD, INTEROP_PG_DB

services:
  # ── HTTP/HTTPS reference server ────────────────
  nginx:
    image: nginx:alpine
    container_name: legoflow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s

  # ── AMQP reference broker (RabbitMQ) ──────────
  rabbitmq:
    image: rabbitmq:4-management
    container_name: legoflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ──AMQP 1.0 + STOMP reference broker (ActiveMQ) ──
  activemq:
    image: apache/activemq:latest
    container_name: legoflow-activemq
    ports:
      - "5673:5672"
      - "61613:61613"
    volumes:
      - ./docker/activemq/activemq.xml:/opt/apache-activemq/conf/activemq.xml:ro
      - ./docker/activemq/users.properties:/opt/apache-activemq/conf/users.properties:ro
      - ./docker/activemq/groups.properties:/opt/apache-activemq/conf/groups.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "perl -e 'use IO::Socket::INET; my $$s = IO::Socket::INET->new(PeerAddr => \"localhost\", PeerPort => 61613, Proto => \"tcp\"); exit(defined($$s) ? 0 : 1)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── NATS reference broker ──────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: legoflow-nats
    ports:
      - "4222:4222"
    command: ["-js", "-DV"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── XMPP reference server (Prosody) ──────────
  prosody:
    image: prosody/prosody:latest
    container_name: legoflow-prosody
    ports:
      - "5222:5222"
      - "5269:5269"
    volumes:
      - ./docker/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - ./docker/localhost.crt:/etc/prosody/certs/localhost.crt:ro
      - ./docker/localhost.key:/etc/prosody/certs/localhost.key:ro
    environment:
      LOCAL: test
      PASSWORD: test
      DOMAIN: localhost
    healthcheck:
      test: ["CMD-SHELL", "perl -e 'use IO::Socket::INET; my $$s = IO::Socket::INET->new(PeerAddr => \"localhost\", PeerPort => 5222, Proto => \"tcp\"); exit(defined($$s) ? 0 : 1)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ── LDAP reference server (OpenLDAP) ───────────
  openldap:
    image: osixia/openldap:latest
    container_name: legoflow-openldap
    ports:
      - "389:389"
    environment:
      LDAP_ADMIN_PASSWORD: admin
      LDAP_BASE_DN: dc=example,dc=com
      LDAP_DOMAIN: example.com
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=example,dc=com -D cn=admin,dc=example,dc=com -w admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30


  # ── MQTT reference broker ───────────────────────
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: legoflow-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis reference server ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: legoflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── PostgreSQL reference server ────────────────
  postgresql:
    image: postgres:17-alpine
    container_name: legoflow-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: legoflow
      POSTGRES_PASSWORD: legoflow
      POSTGRES_DB: legoflow_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legoflow || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── SMTP reference server (MailHog) ─────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: legoflow-mailhog
    ports:
      - "25:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8025/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FTP reference server (Custom Pure-FTPd with pre-built PureDB) ──
  ftp:
    build: ./docker/ftp-server
    container_name: legoflow-ftp
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 21 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
