# AMQP 1.0 Interop Test Reference Servers
# Usage: docker compose up -d
# Verify: docker compose ps
# Teardown: docker compose down

services:
  artemis:
    image: apache/artemis:latest-alpine
    container_name: artemis-test
    ports:
      - "5675:5672"    # AMQP
      - "8161:8161"    # Web console
    environment:
      - ARTEMIS_USER=guest
      - ARTEMIS_PASSWORD=amq
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-test
    ports:
      - "5672:5672"    # AMQP (includes AMQP 1.0 plugin)
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    entrypoint: /bin/sh -c "./docker-entrypoint.sh && rabbitmq-plugins enable --online rabbitmq_amqp1_0 && rabbitmqadmin declare queue --name interop-test-queue --durable true && exec rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
