# Lego Flow — Gradle build properties

# Enable parallel execution by default (up to 10 workers)
org.gradle.parallel=true
org.gradle.workers.max=10

# Enable build caching for faster incremental builds
org.gradle.caching=true

# Use daemon for faster subsequent builds
org.gradle.daemon=true

# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC

# JDK 25 toolchain location (Homebrew install — Gradle can't auto-detect it)
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.java.installations.paths=/opt/homebrew/Cellar/openjdk/25.0.2/libexec/openjdk.jdk/Contents/Home

# Project properties
legoFlowVersion=0.1.0-SNAPSHOT
javaRelease=25

# Dependency versions
slf4jVersion=1.7.36
slf4jSimpleVersion=2.0.9
junitVersion=5.11.4
mockitoVersion=5.8.0
assertjVersion=3.24.2
junitPlatformVersion=1.11.4
