# Lego Flow — CI/CD Pipeline
# Builds, tests, and validates all 42+ modules with coverage gates.
#
# Build strategy:
#   • Gradle handles compile + unit tests (fast, parallel, cached)
#   • Maven handles coverage gate only (JaCoCo XML report generation)
#   • Interop tests run separately when Docker services are available

name: CI

on:
  push:
    branches: [main, productize, "3-tests-pipeline*"]
  pull_request:
    branches: [main, productize]

env:
  MAVEN_OPTS: "-Xmx4g -Dmaven.artifact.threads=8"

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & Test — Gradle (fast compile + unit tests)
  #    Parallel across modules, build-cached between runs
  # ──────────────────────────────────────────────
  build:
    name: "Build & Test (${{ matrix.os }}, Java ${{ matrix.java }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [25]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java runtime ─────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      # ── Gradle build cache for dependency repository ──
      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      # ── Compile + test with Gradle (no coverage — fast) ───────────────
      - name: Compile and run unit tests
        run: |
          ./gradlew clean compileJava test \
            -PskipInteropTests=true \
            --parallel \
            --no-daemon
        env:
          CI: true

      # ── Upload test results (Gradle format) ───────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/build/reports/tests/test/index.html"
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Coverage threshold gate (Maven — XML report generation)
  #    Maven still needed for JaCoCo prepare-agent + report-aggregate
  #    because Gradle 9.x removed the built-in jacoco plugin.
  # ──────────────────────────────────────────────
  coverage-gate:
    name: "Coverage Gate"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with coverage instrumentation (skip interop tests — no Docker services)
        run: mvn -B verify -T 1C -P all,jacoco-coverage -DskipInteropTests=true
        env:
          CI: true

      # ── Upload JaCoCo HTML report for review ──────────────────────────
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco-aggregate/
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. Protocol-specific test matrices (Gradle)
  #    Fast targeted builds per protocol category using Gradle subproject
  #    selection instead of Maven profiles.
  #
  #    Module paths use :project:test syntax so Gradle resolves them as
  #    project-task references rather than bare project names (which would
  #    be interpreted as task names in the root project).
  # ──────────────────────────────────────────────
  protocol-tests:
    name: "Protocol Tests (${{ matrix.profile }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - profile: web-only
            modules: ":blocks:test :service:test :lego-flow-http:test :lego-flow-http2:test :lego-flow-http3:test :lego-flow-web-services:test :lego-flow-http-proxy:test"
          - profile: messaging-only
            modules: ":blocks:test :service:test :lego-flow-kafka:test :lego-flow-amqp:test :lego-flow-stomp:test :lego-flow-nats:test :lego-flow-mqtt:test :lego-flow-xmpp:test :lego-flow-wamp:test"
          - profile: network-only
            modules: ":blocks:test :service:test :lego-flow-network-common:test :lego-flow-dns:test :lego-flow-ldap:test :lego-flow-snmp:test :lego-flow-syslog:test :lego-flow-modbus:test :lego-flow-ssh:test :lego-flow-ftp:test"
          - profile: auth-only
            modules: ":blocks:test :service:test :lego-flow-gssapi:test :lego-flow-http-auth-core:test :lego-flow-http-auth-basic-digest:test :lego-flow-http-auth-oauth:test :lego-flow-http-auth-sso:test :lego-flow-http-auth-spnego:test"
          - profile: database-only
            modules: ":blocks:test :service:test :lego-flow-redis:test :lego-flow-postgresql:test :lego-flow-mysql:test"
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Run ${{ matrix.profile }} tests
        run: ./gradlew -PskipInteropTests=true --parallel --no-daemon ${{ matrix.modules }}
        env:
          CI: true

  # ──────────────────────────────────────────────
  # 4. Build verification (Gradle — fast check)
  # ──────────────────────────────────────────────
  build-check:
    name: "Build Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Validate and compile (skip tests)
        run: ./gradlew clean compileJava --no-daemon
        env:
          CI: true

  # ──────────────────────────────────────────────
  # 5. Interoperability tests (Maven + Docker Compose)
  #    Runs against real reference implementations
  #    Uses docker compose for volume mounts (nginx config, mosquitto config)
  #    Gradle interop tests also supported via -PskipInteropTests=false
  # ──────────────────────────────────────────────
  interoperability-tests:
    name: "Interoperability Tests"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Docker services
        run: |
          docker compose -f interop-tests/docker-compose.yml up -d
          echo "Waiting for all services to become healthy..."
          timeout=120
          elapsed=0
          interval=5
          while [ $elapsed -lt $timeout ]; do
            all_healthy=true
            for svc in nginx mosquitto redis postgresql; do
              status=$(docker inspect --format='{{.State.Health.Status}}' "legoflow-${svc}" 2>/dev/null || echo "not_found")
              if [ "$status" != "healthy" ]; then
                all_healthy=false
                echo "  ${svc}: ${status}"
              fi
            done
            if [ "$all_healthy" = true ]; then
              echo "All services healthy!"
              docker compose -f interop-tests/docker-compose.yml ps
              break
            fi
            elapsed=$((elapsed + interval))
            echo "Waiting... (${elapsed}s / ${timeout}s)"
            sleep $interval
          done
          # Final verification
          for svc in nginx mosquitto redis postgresql; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "legoflow-${svc}" 2>/dev/null || echo "not_found")
            if [ "$status" != "healthy" ]; then
              echo "ERROR: ${svc} is not healthy (status: ${status})"
              docker logs "legoflow-${svc}" 2>&1 | tail -30
              exit 1
            fi
          done

      - name: Run interoperability tests (Docker services are running)
        run: mvn -B verify -pl interop-tests -am -P all -DskipInteropTests=false \
          -Dinterop.nginx.host=localhost -Dinterop.nginx.port=8080 \
          -Dinterop.mosquitto.host=localhost -Dinterop.mosquitto.port=1883 \
          -Dinterop.redis.host=localhost -Dinterop.redis.port=6379 \
          -Dinterop.pg.host=localhost -Dinterop.pg.port=5432 \
          -Dinterop.pg.user=legoflow -Dinterop.pg.password=legoflow \
          -Dinterop.pg.db=legoflow_test
        env:
          CI: true

      - name: Stop Docker services
        if: always()
        run: docker compose -f interop-tests/docker-compose.yml down
