# Lego Flow — CI/CD Pipeline
# Builds, tests, and validates all 42+ modules with coverage gates.

name: CI

on:
  push:
    branches: [main, productize, "3-tests-pipeline*"]
  pull_request:
    branches: [main, productize]

env:
  MAVEN_OPTS: "-Xmx4g -Dmaven.artifact.threads=8"

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & Test — matrix strategy
  # ──────────────────────────────────────────────
  build:
    name: "Build & Test (${{ matrix.os }}, Java ${{ matrix.java }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [25]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java runtime ─────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      # ── Maven cache for dependency repository ──
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── Compile ──────────────────────────────
      - name: Compile project
        run: mvn -B compile -T 1C -P all
        env:
          CI: true

      # ── Run tests with JaCoCo instrumentation ─
      - name: Run tests with coverage (skip interop tests — no Docker services)
        run: |
          mvn -B verify -T 1C -P all \
            -Djacoco.includes=ssg.legoflow.** \
            -DfailIfNoTests=false \
            -DskipInteropTests=true
        env:
          CI: true

      # ── JaCoCo report aggregation ────────────
      - name: Aggregate JaCoCo reports
        run: mvn -B jacoco:report-aggregate -T 1C -P all,jacoco-coverage
        continue-on-error: false

      # ── Upload coverage artifact ─────────────
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/jacoco-aggregate/
          retention-days: 30

      # ── Upload test results ──────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/target/surefire-reports/*.xml"
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Coverage threshold gate
  # ──────────────────────────────────────────────
  coverage-gate:
    name: "Coverage Gate"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with coverage instrumentation (skip interop tests — no Docker services)
        run: mvn -B verify -T 1C -P all,jacoco-coverage -DskipInteropTests=true
        env:
          CI: true

  # ──────────────────────────────────────────────
  # 3. Protocol-specific test matrices
  #    Run targeted profile builds for fast feedback
  # ──────────────────────────────────────────────
  protocol-tests:
    name: "Protocol Tests (${{ matrix.profile }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile:
          [web-only, messaging-only, network-only, auth-only, database-only]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run ${{ matrix.profile }} profile tests
        run: mvn -B verify -T 1C -P ${{ matrix.profile }} -DskipInteropTests=true
        env:
          CI: true

  # ──────────────────────────────────────────────
  # 4. Build verification (no test, fast check)
  # ──────────────────────────────────────────────
  build-check:
    name: "Build Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Validate and package (skip tests)
        run: mvn -B validate package -T 1C -P all -DskipTests
        env:
          CI: true

  # ──────────────────────────────────────────────
  # 5. Interoperability tests (Docker-based)
  #    Runs against real reference implementations
  # ──────────────────────────────────────────────
  interoperability-tests:
    name: "Interoperability Tests"
    runs-on: ubuntu-latest
    needs: build

    services:
      nginx:
        image: nginx:alpine
        ports:
          - "8080:80"
        options: >-
          --health-cmd "curl -f http://localhost:80/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mosquitto:
        image: eclipse-mosquitto:latest
        ports:
          - "1883:1883"
        options: >-
          --health-cmd "bash -c 'echo pong | mosquitto_pub -h localhost -p 1883 -t test/ping -l && exit 0 || exit 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgresql:
        image: postgres:17-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: legoflow
          POSTGRES_PASSWORD: legoflow
          POSTGRES_DB: legoflow_test
        options: >-
          --health-cmd "pg_isready -U legoflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run interoperability tests (Docker services are running)
        run: mvn -B verify -pl interop-tests -am -P all -DskipInteropTests=false
        env:
          CI: true
          INTEROP_NGINX_HOST: localhost
          INTEROP_NGINX_PORT: 8080
          INTEROP_MOSQUITTO_HOST: localhost
          INTEROP_MOSQUITTO_PORT: 1883
          INTEROP_REDIS_HOST: localhost
          INTEROP_REDIS_PORT: 6379
          INTEROP_PG_HOST: localhost
          INTEROP_PG_PORT: 5432
          INTEROP_PG_USER: legoflow
          INTEROP_PG_PASSWORD: legoflow
          INTEROP_PG_DB: legoflow_test

