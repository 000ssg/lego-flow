# Lego Flow — CI/CD Pipeline (Gradle-based, Phase 3)
# Builds, tests, and validates all 42+ modules with coverage gates.
#
# Build strategy:
#   • Gradle handles everything: compile + unit tests + JaCoCo coverage reports
#   • Interop tests run via Gradle when Docker services are available
#   • Maven is no longer needed in CI (JaCoCo HTML report bug fixed)
#
# Conditional execution:
#   Set `skip-coverage` label on PR to skip coverage gate
#   Set `run-interop` label on PR to enable interoperability tests (disabled by default)
#   Set `run-windows` label on PR to enable slow Windows build (disabled by default)

name: CI

on:
  push:
    branches: [master, productize]
  pull_request:
    branches: [master, productize]

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & Test — Gradle (fast compile + unit tests)
  #    --rerun-tasks ensures JaCoCo agent generates .exec files every time
  # ──────────────────────────────────────────────
  build:
    name: "Build & Test (${{ matrix.os }}, Java ${{ matrix.java }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [25]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── Java runtime ─────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      # ── Gradle build cache for dependency repository ──
      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      # ── Compile + test with Gradle (with JaCoCo instrumentation) ───────────────
      - name: Compile and run unit tests
        run: ./gradlew clean compileJava test -PskipInteropTests=true --parallel --rerun-tasks --no-daemon
        env:
          CI: true
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ── Upload test results (Gradle format) ───────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}
          path: "**/build/reports/tests/test/index.html"
          retention-days: 30

  # ──────────────────────────────────────────────
  # 1b. Windows Build (opt-in via label, disabled by default — 2× slower)
  #     Activate on PR by adding the 'run-windows' label.
  # ──────────────────────────────────────────────
  build-windows:
    name: "Build & Test (windows-latest, Java 25)"
    runs-on: windows-latest
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-windows') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Compile and run unit tests
        run: .\gradlew.bat clean compileJava test -PskipInteropTests=true --parallel --rerun-tasks --no-daemon
        env:
          CI: true
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: "**/build/reports/tests/test/index.html"
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Coverage Gate — Gradle (HTML + XML JaCoCo reports)
  #    Replaced Maven coverage gate with Gradle jacocoAggregateReport task.
  #    Can be skipped by adding 'skip-coverage' label on PR.
  # ──────────────────────────────────────────────
  coverage-gate:
    name: "Coverage Gate"
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-coverage') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Generate aggregate JaCoCo coverage report
        run: ./gradlew jacocoAggregateReport --no-daemon --rerun-tasks -PskipInteropTests=true
        env:
          CI: true
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ── Upload JaCoCo HTML report for review ──────────────────────────
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: build/jacoco/aggregate/html/
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. Protocol-specific test matrices (Gradle)
  #    Fast targeted builds per protocol category using Gradle subproject selection.
  #    Module paths use :project:test syntax so Gradle resolves them as
  #    project-task references rather than bare project names.
  # ──────────────────────────────────────────────
  protocol-tests:
    name: "Protocol Tests (${{ matrix.profile }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - profile: web-only
            modules: ":lego-flow-blocks:test :lego-flow-service:test :lego-flow-http:test"
          - profile: messaging-only
            modules: ":lego-flow-blocks:test :lego-flow-service:test :lego-flow-http:test :lego-flow-mqtt:test"
          - profile: auth-only
            modules: ":lego-flow-blocks:test :lego-flow-service:test :lego-flow-gssapi:test :lego-flow-http-auth-core:test :lego-flow-http-auth-basic-digest:test :lego-flow-http-auth-oauth:test :lego-flow-http-auth-sso:test :lego-flow-http-auth-spnego:test"
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Run ${{ matrix.profile }} tests
        run: ./gradlew -PskipInteropTests=true --parallel --no-daemon --rerun-tasks ${{ matrix.modules }}
        env:
          CI: true
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # ──────────────────────────────────────────────
  # 4. Interoperability tests (Maven + Docker Compose) — 4 groups, 3 active jobs
  #    Each active group runs in its own job against the reference brokers its
  #    protocols need (see interop-tests/doc/ci-groups.md):
  #      interop-messaging-core: MQTT, STOMP, AMQP — mosquitto, rabbitmq, artemis
  #      interop-kafka:          Kafka composite tests — kafka (KRaft broker)
  #      interop-wamp:           WAMP composite tests — crossbar (WAMP router)
  #    interop-rest has existing tests (re-tagged) but its CI job is disabled
  #    until proper rest interop is implemented (see the plan tracker).
  #    kafka/wamp: failIfNoTests=false until the Phase 6 composite tests land.
  #    Disabled by default — enable with 'run-interop' label on PR.
  # ──────────────────────────────────────────────
  interoperability-tests:
    name: "Interop (${{ matrix.group }})"
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-interop') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: interop-messaging-core
            services: "artemis rabbitmq mosquitto"
            containers: "artemis-test rabbitmq-test mosquitto-test"
            failIfNoTests: "true"
          - group: interop-kafka
            services: "kafka"
            containers: "kafka-test"
            failIfNoTests: "false"
          - group: interop-wamp
            services: "crossbar"
            containers: "wamp-router-test"
            failIfNoTests: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Start Docker services for ${{ matrix.group }}
        run: |
          cd interop-tests
          docker compose up -d ${{ matrix.services }}
          echo "Waiting for ${{ matrix.containers }} to become healthy..."
          timeout=180
          elapsed=0
          interval=5
          while [ $elapsed -lt $timeout ]; do
            all_healthy=true
            for c in ${{ matrix.containers }}; do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || echo "not_found")
              if [ "$status" != "healthy" ]; then
                all_healthy=false
                echo "  $c: $status"
              fi
            done
            if [ "$all_healthy" = true ]; then
              echo "All services healthy!"
              docker compose ps
              break
            fi
            elapsed=$((elapsed + interval))
            echo "Waiting... (${elapsed}s / ${timeout}s)"
            sleep $interval
          done
          for c in ${{ matrix.containers }}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || echo "not_found")
            if [ "$status" != "healthy" ]; then
              echo "ERROR: $c is not healthy (status: $status)"
              docker logs "$c" 2>&1 | tail -30
              exit 1
            fi
          done

      # Wire-capture reference clients for the AMQP 1.0 tests (core group only):
      #   - Artemis CLI: copied out of the artemis container (producer/consumer
      #     subcommands; version-pinned with the broker image)
      #   - aiormq: Python AMQP 1.0 client for the RabbitMQ capture scenario
      - name: Set up AMQP 1.0 wire-capture reference clients
        if: matrix.group == 'interop-messaging-core'
        working-directory: interop-tests
        run: |
          docker cp artemis-test:/opt/artemis src/test/resources/artemis-cli
          chmod +x src/test/resources/artemis-cli/bin/artemis
          python3 -m pip install --quiet 'aiormq>=6,<7'
          python3 -c "import aiormq; print('aiormq', aiormq.__version__)"

      - name: Run ${{ matrix.group }} interop tests (Maven)
        run: |
          mvn install -DskipTests -pl interop-tests -am -q
          mvn verify -pl interop-tests -am -DskipInteropTests=false -Dinterop.group=${{ matrix.group }} -Dinterop.failIfNoTests=${{ matrix.failIfNoTests }}
        env:
          CI: true

      - name: Stop Docker services
        if: always()
        run: cd interop-tests && docker compose down --remove-orphans
