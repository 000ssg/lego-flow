# Lego Flow — CI/CD Pipeline
# Builds, tests, and validates all 42+ modules with coverage gates.

name: CI

on:
  push:
    branches: [main, productize, "3-tests-pipeline*"]
  pull_request:
    branches: [main, productize]

env:
  MAVEN_OPTS: "-Xmx4g -Dmaven.artifact.threads=8"

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & Test — matrix strategy
  # ──────────────────────────────────────────────
  build:
    name: "Build & Test (${{ matrix.os }}, Java ${{ matrix.java }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [25]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java runtime ─────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      # ── Maven cache for dependency repository ──
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── Compile ──────────────────────────────
      - name: Compile project
        run: mvn -B compile -T 1C -P all
        env:
          CI: true

      # ── Run tests with JaCoCo instrumentation ─
      - name: Run tests with coverage (skip interop tests — no Docker services)
        run: |
          mvn -B verify -T 1C -P all \
            -Djacoco.includes=ssg.legoflow.** \
            -DfailIfNoTests=false \
            -DskipInteropTests=true
        env:
          CI: true

      # ── JaCoCo report aggregation ────────────
      - name: Aggregate JaCoCo reports
        run: mvn -B jacoco:report-aggregate -T 1C -P all,jacoco-coverage
        continue-on-error: false

      # ── Upload coverage artifact ─────────────
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/jacoco-aggregate/
          retention-days: 30

      # ── Upload test results ──────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/target/surefire-reports/*.xml"
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Coverage threshold gate
  # ──────────────────────────────────────────────
  coverage-gate:
    name: "Coverage Gate"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with coverage instrumentation (skip interop tests — no Docker services)
        run: mvn -B verify -T 1C -P all,jacoco-coverage -DskipInteropTests=true
        env:
          CI: true

  # ──────────────────────────────────────────────
  # 3. Protocol-specific test matrices
  #    Run targeted profile builds for fast feedback
  # ──────────────────────────────────────────────
  protocol-tests:
    name: "Protocol Tests (${{ matrix.profile }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile:
          [web-only, messaging-only, network-only, auth-only, database-only]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run ${{ matrix.profile }} profile tests
        run: mvn -B verify -T 1C -P ${{ matrix.profile }} -DskipInteropTests=true
        env:
          CI: true

  # ──────────────────────────────────────────────
  # 4. Build verification (no test, fast check)
  # ──────────────────────────────────────────────
  build-check:
    name: "Build Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Validate and package (skip tests)
        run: mvn -B validate package -T 1C -P all -DskipTests
        env:
          CI: true

  # ──────────────────────────────────────────────
  # 5. Interoperability tests (Docker Compose)
  #    Runs against real reference implementations
  #    Uses docker compose for volume mounts (nginx config, mosquitto config)
  # ──────────────────────────────────────────────
  interoperability-tests:
    name: "Interoperability Tests"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Docker services
        run: |
          docker compose -f interop-tests/docker-compose.yml up -d
          echo "Waiting for all services to become healthy..."
          timeout=120
          elapsed=0
          interval=5
          while [ $elapsed -lt $timeout ]; do
            all_healthy=true
            for svc in nginx mosquitto redis postgresql; do
              status=$(docker inspect --format='{{.State.Health.Status}}' "legoflow-${svc}" 2>/dev/null || echo "not_found")
              if [ "$status" != "healthy" ]; then
                all_healthy=false
                echo "  ${svc}: ${status}"
              fi
            done
            if [ "$all_healthy" = true ]; then
              echo "All services healthy!"
              docker compose -f interop-tests/docker-compose.yml ps
              break
            fi
            elapsed=$((elapsed + interval))
            echo "Waiting... (${elapsed}s / ${timeout}s)"
            sleep $interval
          done
          # Final verification
          for svc in nginx mosquitto redis postgresql; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "legoflow-${svc}" 2>/dev/null || echo "not_found")
            if [ "$status" != "healthy" ]; then
              echo "ERROR: ${svc} is not healthy (status: ${status})"
              docker logs "legoflow-${svc}" 2>&1 | tail -30
              exit 1
            fi
          done

      - name: Run interoperability tests (Docker services are running)
        run: mvn -B verify -pl interop-tests -am \
          -P all \
          -DskipInteropTests=false \
          -Dinterop.nginx.host=localhost \
          -Dinterop.nginx.port=8080 \
          -Dinterop.mosquitto.host=localhost \
          -Dinterop.mosquitto.port=1883 \
          -Dinterop.redis.host=localhost \
          -Dinterop.redis.port=6379 \
          -Dinterop.pg.host=localhost \
          -Dinterop.pg.port=5432 \
          -Dinterop.pg.user=legoflow \
          -Dinterop.pg.password=legoflow \
          -Dinterop.pg.db=legoflow_test
        env:
          CI: true

      - name: Stop Docker services
        if: always()
        run: docker compose -f interop-tests/docker-compose.yml down
